<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thư tặng 22 em xinh A1K15</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff4d6d;
      --secondary: #ff758f;
      --glass-bg: rgba(0, 0, 0, 0.45);
      --glass-border: rgba(255, 255, 255, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      user-select: none;
    }

    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('/static/backgrounds/tap_the_lop.jpg');
      background-size: cover;
      background-position: center;
      transition: background-image 1s ease-in-out;
      z-index: 1;
    }

    .bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(16, 0, 43, 0.55);
      backdrop-filter: blur(4px);
      z-index: 2;
    }

    #canvas-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none; /* Để cú click nhận vào window */
    }

    .app-container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      padding: 35px 30px;
      width: 100%;
      max-width: 520px; /* Làm thẻ rộng hơn một chút cho thoải mái */
      text-align: center;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      position: absolute;
      transform: scale(1);
      opacity: 1;
    }

    .glass-card.hidden {
      opacity: 0;
      transform: scale(0.8) translateY(30px);
      pointer-events: none;
    }

    .tab1-title {
      font-family: 'Dancing Script', cursive;
      font-size: 3rem;
      color: #ffb3c1;
      margin-bottom: 12px;
      text-shadow: 0 0 12px rgba(255, 77, 109, 0.7);
    }

    .tab1-sub {
      font-size: 1rem;
      color: #e0aaff;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .input-group {
      position: relative;
      margin-bottom: 25px;
    }

    .name-input {
      width: 100%;
      padding: 16px 20px;
      border-radius: 50px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 1.1rem;
      font-family: 'Montserrat', sans-serif;
      outline: none;
      text-align: center;
      transition: all 0.3s ease;
    }

    .name-input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .name-input:focus {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 20px rgba(255, 77, 109, 0.5);
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, #ff4d6d 0%, #c77dff 100%);
      color: white;
      font-size: 1.15rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 77, 109, 0.4);
      transition: all 0.3s ease;
    }

    .btn-submit:active { transform: scale(0.96); }
    .wishes-text {
      white-space: pre-line;
    }
    .tab2-container {
      max-width: 550px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-height: 90vh;
      overflow-y: auto;
    }

    .card-header-img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 4px solid var(--secondary);
      object-fit: cover;
      box-shadow: 0 0 25px rgba(255, 117, 143, 0.8);
      margin-bottom: 15px;
      animation: pulse-border 2s infinite alternate;
    }

    @keyframes pulse-border {
      0% { box-shadow: 0 0 15px rgba(255, 117, 143, 0.5); }
      100% { box-shadow: 0 0 30px rgba(255, 117, 143, 0.9), 0 0 10px #fff; }
    }

    .recipient-name {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      color: #ffb3c1;
      margin-bottom: 15px;
      text-shadow: 0 0 15px rgba(255, 77, 109, 0.6);
    }

    .wishes-box {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
      min-height: 140px;
      text-align: left;
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: 100%;
    }

    .wishes-text {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #f8f9fa;
      white-space: pre-line;
    }

    .typing-cursor {
      display: inline-block;
      width: 3px;
      height: 1.1em;
      background-color: var(--primary);
      vertical-align: middle;
      animation: blink 0.7s infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
</head>
<body>

  <div id="bgImage" class="bg-image"></div>
  <div class="bg-overlay"></div>
  <canvas id="canvas-bg"></canvas>

  <div class="app-container">
    <!-- TAB 1 -->
    <div id="tab1" class="glass-card">
      <h1 class="tab1-title">20 Tháng 10</h1>
      <p class="tab1-sub">Your Full name ❤️</p>
      
      <div class="input-group">
        <input type="text" id="nameInput" class="name-input" placeholder="Nhập tên..." autocomplete="off">
      </div>

      <button id="btnStart" class="btn-submit">Mở Thư Ngay ✨</button>
    </div>

    <!-- TAB 2 -->
    <div id="tab2" class="glass-card tab2-container hidden">
      <img id="recipientImg" src="" alt="Avatar" class="card-header-img">
      
      <h2 id="recipientName" class="recipient-name">Gửi tới...</h2>

      <div class="wishes-box">
        <span id="wishesText" class="wishes-text"></span><span id="cursor" class="typing-cursor"></span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 5 MẪU TRÁI TIM KHÁC NHAU DÙNG CHO PHÁO HOA NỔ
    const heartTypes = ['❤️', '💖', '💗', '💓', '✨'];
    
    // MẪU HOA VÀ TRÁI TIM RƠI NHẸ (MƯA HOA / MƯA TRÁI TIM)
    const fallingTypes = ['🌸', '🌺', '💖', '💕', '🌷', '✨'];

    const fireworks = [];
    const rainParticles = [];

    // 1. CẤU TRÚC HẠT PHÁO HOA TRÁI TIM (NỔ KHI CLICK)
    class HeartFirework {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 3; // Bắn ra xa và nhanh hơn
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.size = Math.random() * 16 + 14; // Kích thước icon trái tim
        this.symbol = heartTypes[Math.floor(Math.random() * heartTypes.length)];
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.015;
        this.gravity = 0.12;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.2;
      }

      update() {
        this.vx *= 0.95;
        this.vy *= 0.95;
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.rotation += this.rotSpeed;
        this.alpha -= this.decay;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(this.alpha, 0);
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.font = `${this.size}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.symbol, 0, 0);
        ctx.restore();
      }
    }

    // 2. CẤU TRÚC MƯA HOA & MƯA TRÁI TIM RƠI TỰ NHIÊN
    class RainParticle {
      constructor() {
        this.reset();
        this.y = Math.random() * height; // Rải đều màn hình khi mới vào
      }

      reset() {
        this.x = Math.random() * width;
        this.y = -20;
        this.size = Math.random() * 14 + 12;
        this.speedY = Math.random() * 1.5 + 0.8; // Rơi chậm nhẹ nhàng
        this.speedX = Math.sin(Math.random() * Math.PI) * 0.6;
        this.symbol = fallingTypes[Math.floor(Math.random() * fallingTypes.length)];
        this.opacity = Math.random() * 0.7 + 0.3;
        this.rotation = Math.random() * Math.PI;
      }

      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y / 30) * 0.5; // Đung đưa nhẹ khi rơi
        this.rotation += 0.01;

        if (this.y > height + 20) {
          this.reset();
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.font = `${this.size}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.symbol, 0, 0);
        ctx.restore();
      }
    }

    // Khởi tạo 35 hạt mưa hoa/trái tim rơi
    for (let i = 0; i < 35; i++) {
      rainParticles.push(new RainParticle());
    }

    function createFirework(x, y, count = 25) {
      for (let i = 0; i < count; i++) {
        fireworks.push(new HeartFirework(x, y));
      }
    }

    // BẬT VÒNG LẶP ANIMATION CANVAS
    function animate() {
      ctx.clearRect(0, 0, width, height);

      // Vẽ mưa hoa & trái tim
      rainParticles.forEach(p => {
        p.update();
        p.draw();
      });

      // Vẽ pháo hoa trái tim khi click
      for (let i = fireworks.length - 1; i >= 0; i--) {
        const f = fireworks[i];
        f.update();
        f.draw();
        if (f.alpha <= 0) {
          fireworks.splice(i, 1);
        }
      }

      requestAnimationFrame(animate);
    }
    animate();

    // Bắt sự kiện click/chạm để bắn pháo hoa trái tim
    window.addEventListener('pointerdown', (e) => {
      createFirework(e.clientX, e.clientY, 25);
    });

    // ==========================================
    // KẾT NỐI BACKEND FLASK
    // ==========================================
    const btnStart = document.getElementById('btnStart');
    const nameInput = document.getElementById('nameInput');
    const tab1 = document.getElementById('tab1');
    const tab2 = document.getElementById('tab2');
    const recipientImg = document.getElementById('recipientImg');
    const recipientName = document.getElementById('recipientName');
    const wishesText = document.getElementById('wishesText');
    const cursor = document.getElementById('cursor');
    const bgImage = document.getElementById('bgImage');

    btnStart.addEventListener('click', async (e) => {
      e.stopPropagation();
      
      const name = nameInput.value.trim();
      if (!name) {
        alert('Vui lòng nhập tên người ấy nhé!');
        return;
      }

      btnStart.innerText = "Đang mở thư...";
      btnStart.disabled = true;

      // Nổ pháo hoa lớn tại nút bấm
      const rect = btnStart.getBoundingClientRect();
      createFirework(rect.left + rect.width / 2, rect.top + rect.height / 2, 40);

      try {
        const response = await fetch('/api/get-card', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name })
        });

        const data = await response.json();

        if (data.success) {
          recipientImg.src = data.image_url;

          if (data.bg_url) {
            bgImage.style.backgroundImage = `url('${data.bg_url}')`;
          }

          tab1.classList.add('hidden');
          setTimeout(() => {
            tab1.style.display = 'none';
            tab2.classList.remove('hidden');
            
            // Nổ pháo hoa cực lớn mừng kết quả
            createFirework(width / 2, height / 3, 50);
            
            startTypingWishes(data.name, data.wishes);
          }, 500);
        }
      } catch (err) {
        alert('Có lỗi kết nối server!');
        btnStart.innerText = "Mở Thư Ngay ✨";
        btnStart.disabled = false;
      }
    });

    function startTypingWishes(name, wishesMsg) {
      recipientName.innerHTML = `Chúc Mừng 20/10!<br>${name} 💕`;
      let charIndex = 0;
      wishesText.innerText = "";

      function typeWriter() {
        if (charIndex < wishesMsg.length) {
          wishesText.innerText += wishesMsg.charAt(charIndex);
          charIndex++;
          setTimeout(typeWriter, 35);
        } else {
          cursor.style.display = 'none';
        }
      }
      setTimeout(typeWriter, 400);
    }
  </script>
</body>
</html>
